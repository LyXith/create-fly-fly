name: Build

on:
  push:
    branches: ["26.3"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          cat > /tmp/maxerrs.gradle <<'GRADLE'
          allprojects {
            tasks.withType(JavaCompile).configureEach {
              options.compilerArgs += ["-Xmaxerrs", "20000", "-Xmaxwarns", "0"]
            }
          }
          GRADLE
          ./gradlew build --no-daemon --continue -Dorg.gradle.console=plain -I /tmp/maxerrs.gradle 2>&1 | tee build.log
      - name: Dump the game's class index and requested signatures
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/ci
          jars=$(find ~/.gradle/caches/fabric-loom .gradle/loom-cache -name '*.jar' 2>/dev/null | grep -iE 'minecraft' | grep -v sources || true)
          echo "$jars" > /tmp/ci/jars.txt
          cp=$(echo "$jars" | paste -sd: -)
          for j in $jars; do unzip -Z1 "$j" | grep '\.class$' ; done | sed 's/\.class$//' | sort -u > /tmp/ci/classes.txt || true
          sed 's#/#.#g' /tmp/ci/classes.txt | grep -v 'package-info' > /tmp/all-classes.txt
          (xargs -a /tmp/all-classes.txt -n 300 javap -p -cp "$cp" 2>/tmp/ci/javap-errors.txt || true) | gzip -9 > /tmp/ci/javap-all.txt.gz
          tail -c 2000 /tmp/ci/javap-errors.txt > /tmp/ci/javap-errors-tail.txt; rm -f /tmp/ci/javap-errors.txt
      - name: Publish build log to the ci-logs branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/ci && cp build.log /tmp/ci/build.log || echo "no log" > /tmp/ci/build.log
          sed -i "s#${GITHUB_WORKSPACE}/##g" /tmp/ci/build.log
          echo "${GITHUB_SHA}" > /tmp/ci/commit.txt
          cd /tmp/ci
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Build log for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: create-fly-26.3
          path: build/libs/*.jar
