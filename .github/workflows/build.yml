name: Build

on:
  push:
    branches: ["pack-26.2"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew build --no-daemon -Dorg.gradle.console=plain 2>&1 | tee build.log
      - name: Publish build log to the ci-logs-26.2 branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/ci && (tail -n 400 build.log > /tmp/ci/build.log || echo "no log" > /tmp/ci/build.log)
          ls -l build/libs > /tmp/ci/jars.txt 2>&1 || true
          echo "${GITHUB_SHA}" > /tmp/ci/commit.txt
          cd /tmp/ci
          git init -q -b ci-logs-26.2
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Build log for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-26.2
      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: create-fly-26.2
          path: build/libs/*.jar
      - name: Publish the jar as a release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete pack-26.2-latest -y --cleanup-tag -R "${{ github.repository }}" || true
          sleep 3
          cp build/libs/create-fly-26.2-6.0.9-1.jar create-fly-26.2.jar
          gh release create pack-26.2-latest create-fly-26.2.jar build/libs/create-fly-26.2-6.0.9-1.jar -R "${{ github.repository }}" --target "${GITHUB_SHA}" --title "Create Fly for 26.2 (pack build)" --notes "Built from the pack-26.2 branch at ${GITHUB_SHA}."
