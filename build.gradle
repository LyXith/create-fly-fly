plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    // JitPack 需要 publishToMavenLocal 才能抓取构件（sable 端以
    // com.github.LyXith:create-fly-fly:<tag> 的坐标依赖本项目）。
    id "maven-publish"
}

repositories {
    def addGroup = { String url, String... groups ->
        exclusiveContent {
            forRepository {
                maven {
                    it.url = url
                }
            }
            filter {
                groups.each {
                    includeGroup it
                }
            }
        }
    }
    addGroup("https://maven.blamejared.com", "mezz.jei")
    addGroup("https://maven.cassian.cc", "cc.cassian.rrv")
    addGroup("https://maven.squiddev.cc", "cc.tweaked")
    addGroup("https://maven.nucleoid.xyz/releases", "eu.pb4")
    addGroup("https://api.modrinth.com/maven", "maven.modrinth")
}

// --- JitPack 发布坐标 ------------------------------------------------------
// JitPack 构建时会传 -Pgroup / -Pversion 表示“对外要提供的坐标”，
// 必须在下面的默认赋值覆盖 project.group / project.version 之前取出来，
// 否则发布出去的坐标会是 com.zurrtum:create-fly-26.3:6.0.9-1，JitPack 找不到构件。
def jitpackGroup = project.findProperty("group")?.toString()?.trim() ?: ""
def jitpackVersion = project.findProperty("version")?.toString()?.trim() ?: ""
if (jitpackVersion == "unspecified") {
    jitpackVersion = ""
}
def jitpackBuild = jitpackGroup.startsWith("com.github.") && !jitpackVersion.isEmpty()

version = "$project.mod_version-$project.mod_id"
group = project.maven_group

base {
    archivesName = "$project.archives_base_name-$project.minecraft_version"
}

loom {
    splitEnvironmentSourceSets()
    accessWidenerPath = file("src/main/resources/create.classtweaker")
    mods {
        create {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    main {
        java {
            exclude 'com/zurrtum/create/compat/rei/**'
            exclude 'com/zurrtum/create/compat/eiv/**'
            exclude 'com/zurrtum/create/mixin/ArchitecturyMixin.java'
        }
    }
    client {
        java {
            exclude 'com/zurrtum/create/client/compat/rei/**'
            exclude 'com/zurrtum/create/client/compat/eiv/**'
            exclude 'com/zurrtum/create/client/mixin/CraftingViewRecipeAccessor.java'
            exclude 'com/zurrtum/create/client/mixin/FabricEIVMixin.java'
            exclude 'com/zurrtum/create/client/mixin/FluidItemSpecialRendererMixin.java'
            exclude 'com/zurrtum/create/client/mixin/ItemSlotMixin.java'
            exclude 'com/zurrtum/create/client/mixin/RecipeViewMenuMixin.java'
            exclude 'com/zurrtum/create/client/mixin/RecipeViewScreenMixin.java'
            exclude 'com/zurrtum/create/client/mixin/ViewTypeButtonMixin.java'
            exclude 'com/zurrtum/create/client/flywheel/lib/model/baked/DualVertexConsumer.java'
            exclude 'com/zurrtum/create/client/mixin/ItemFeatureRendererMixin.java'
            exclude 'com/zurrtum/create/client/mixin/ModelMixin.java'
            exclude 'com/zurrtum/create/client/mixin/ModelPartMixin.java'
            // Iris has no 26.3 build; its 26.1 API still takes the old com.mojang.blaze3d pipeline classes
            exclude 'com/zurrtum/create/client/mixin/IrisPipelinesMixin.java'
        }
    }
}

tasks.register("serverJar", Jar) {
    archiveClassifier = "server"
    from sourceSets.main.output
    from("LICENSE")
    from("licenses") {
        into "licenses"
    }
}

tasks.build {
    dependsOn tasks.serverJar
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    if (project.compile_only_fabric_api.equals("true")) {
        compileOnly fabricApi.module("fabric-transfer-api-v1", project.fabric_version)
        compileOnly fabricApi.module("fabric-events-interaction-v0", project.fabric_version)
        compileOnly fabricApi.module("fabric-recipe-api-v1", project.fabric_version)
        compileOnly fabricApi.module("fabric-resource-loader-v1", project.fabric_version)
        compileOnly fabricApi.module("fabric-block-api-v1", project.fabric_version)
        compileOnly fabricApi.module("fabric-registry-sync-v0", project.fabric_version)
        clientCompileOnly fabricApi.module("fabric-renderer-api-v1", project.fabric_version)
        clientCompileOnly fabricApi.module("fabric-model-loading-api-v1", project.fabric_version)
    } else {
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    }
//    modCompileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
//    if (project.compile_only_rei.equals("false")) {
//        modClientRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
//    }
    clientCompileOnly "mezz.jei:jei-${project.jei_version}"
//    modCompileOnly "maven.modrinth:eiv:${project.eiv_version}"
    clientCompileOnly "cc.cassian.rrv:reliable-recipe-viewer-fabric:${rrv_version}"
    compileOnly "cc.tweaked:cc-tweaked-${project.cct_version}"
    clientCompileOnly "eu.pb4:trinkets:${project.trinkets_version}"
    clientCompileOnly "maven.modrinth:sodium:${project.sodium_version}"
    clientCompileOnly "maven.modrinth:iris:${project.iris_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }

    exclude "_data"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // 编译/运行需要 JDK 25（options.release = 25），而构建 daemon 可能跑在更低版本的 JVM 上。
    // 用 toolchain 让 Gradle 自行探测 JDK 25，避免硬编码 JAVA_HOME。
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    tasks.named("sourcesJar", Jar) {
        from("LICENSE")
        from("licenses") {
            into "licenses"
        }
        exclude '_data'
        exclude 'assets'
        exclude 'data'
        exclude '**/*.bak'
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE")
    from("licenses") {
        into "licenses"
    }
}

// --- maven-publish（JitPack 用）---------------------------------------------
// JitPack 执行 publishToMavenLocal，再按请求坐标把 ~/.m2 里的构件对外提供。
// 发布 jar（build/libs 下的正式 mod jar，含 client 类，与 sable 本地编译用的是同一个）
// + sourcesJar；不能用 components.java —— splitEnvironmentSourceSets 下它对应的
// 是不含 client 的那个 jar。本项目没有 remapJar 任务（26.3 无混淆，Loom 不做重映射）。
publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = jitpackBuild ? jitpackGroup : project.group
            // JitPack 要求 artifactId == 仓库名
            artifactId = jitpackBuild ? "create-fly-fly" : project.base.archivesName.get()
            version = jitpackBuild ? jitpackVersion : project.version

            artifact(tasks.named("jar")) {
                classifier = ""
                extension = "jar"
            }
            artifact(tasks.named("sourcesJar")) {
                classifier = "sources"
                extension = "jar"
            }

            pom {
                name = "Create-Fly"
                description = "Create backport for Fabric 26.3."
                url = "https://github.com/LyXith/create-fly-fly"
            }
        }
    }
}
